kind = "web"
previewPath = "/"
title = "Vaishnavi Gaikwad Portfolio"
description = "A premium recruiter-focused portfolio for Vaishnavi Gaikwad, showcasing full-stack engineering work, Web3 projects, experience, skills, and editable case studies."
version = "1.0.0"
id = "artifacts/vaishnavi-portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18919

[services.development]
run = "pnpm --filter @workspace/vaishnavi-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vaishnavi-portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/vaishnavi-portfolio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18919"
BASE_PATH = "/"
